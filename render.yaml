# ============================================================
# Render 部署配置 (Infrastructure as Code)
# 连接 GitHub 仓库后，Render 自动读取此文件完成部署
# 文档: https://render.com/docs/infrastructure-as-code
# ============================================================

services:
  - type: web
    name: skyworth-hotel-tool
    env: node
    repo: https://github.com/pabofeika/skyworth-hotel-tool
    region: singapore           # 新加坡（亚洲延迟低）
    branch: develop
    rootDir: create-hotel-tool  # 项目子目录
    buildCommand: npm install
    startCommand: node server.js
    plan: free                  # 免费层 (如需更高性能改 starter/pro)

    # 健康检查（/health 端点已实现）
    healthCheckPath: /health

    # ===== 环境变量 =====
    # 部署后请在 Render Dashboard → Environment 中填入真实值
    envVars:
      - key: HOTEL_URL
        value: https://cooshare.coocaa.com/hotel
        sync: false
      - key: FID
        value: "404"
        sync: false
      - key: LOGIN_USERNAME
        value: n8n
        sync: false
      - key: LOGIN_PASSWORD
        value: 5877e26c078d6409fde54d508bf25721
        sync: false
      - key: SOURCE_HOTEL_ID
        value: "214"
        sync: false
      - key: DEEPSEEK_API_KEY
        value: sk-b8X8vZ424xsFLpRUlGWQQQ
        sync: false
      - key: DEEPSEEK_API_URL
        value: http://139.199.17.11/v1/chat/completions
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
        sync: false
      - key: HUASHI_URL
        value: https://skyworth-business.com/huashi-api
        sync: false
      - key: HUASHI_USERNAME
        value: chenlingN8N
        sync: false
      - key: HUASHI_PASSWORD
        value: chenlingN8N
        sync: false
      - key: REQUEST_TIMEOUT
        value: "30000"
        sync: false
      - key: PORT
        value: "3000"
        sync: false
