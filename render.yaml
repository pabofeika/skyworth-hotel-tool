# ============================================================
# Render 部署配置 (Infrastructure as Code)
# 连接 GitHub 仓库后，Render 自动读取此文件完成部署
# 文档: https://render.com/docs/infrastructure-as-code
# ============================================================

services:
  - type: web
    name: skyworth-hotel-tool
    env: node
    repo: https://github.com/pabofeika/skyworth-hotel-tool
    region: singapore           # 新加坡（亚洲延迟低）
    branch: develop
    rootDir: create-hotel-tool  # 项目子目录
    buildCommand: npm install
    startCommand: node server.js
    plan: free                  # 免费层 (如需更高性能改 starter/pro)

    # 健康检查（/health 端点已实现）
    healthCheckPath: /health

    # ===== 环境变量 =====
    # 部署后请在 Render Dashboard → Environment 中填入真实值
    envVars:
      - key: HOTEL_URL
        sync: false
      - key: FID
        sync: false
      - key: LOGIN_USERNAME
        sync: false
      - key: LOGIN_PASSWORD
        sync: false
      - key: SOURCE_HOTEL_ID
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com/chat/completions
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
        sync: false
      - key: HUASHI_URL
        sync: false
      - key: HUASHI_USERNAME
        sync: false
      - key: HUASHI_PASSWORD
        sync: false
      - key: REQUEST_TIMEOUT
        value: "30000"
        sync: false
      - key: PORT
        value: "3000"
        sync: false
