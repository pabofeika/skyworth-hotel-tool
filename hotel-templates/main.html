<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店模板展示站</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ============ 布局 ============ */
  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ============ 左侧导航 ============ */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-header .logo { font-size: 24px; }
  .sidebar-header h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-sidebar-active);
  }
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }
  .nav-category {
    margin-bottom: 4px;
  }
  .nav-cat-title {
    padding: 8px 20px 4px;
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    margin: 1px 10px;
    border-radius: 8px;
    color: var(--text-sidebar);
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
    border: none;
    background: none;
    width: calc(100% - 20px);
    text-align: left;
    font-family: var(--font);
  }
  .nav-item:hover { background: var(--bg-sidebar-hover); color: #e2e8f0; }
  .nav-item.active {
    background: var(--bg-sidebar-active);
    color: var(--text-sidebar-active);
    font-weight: 500;
  }
  .nav-item .dot { font-size: 10px; opacity: 0.5; }
  .nav-item.active .dot { opacity: 1; }
  .nav-item .count {
    margin-left: auto;
    font-size: 11px;
    opacity: 0.5;
    background: rgba(255,255,255,0.1);
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* ============ 右侧主区域 ============ */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .topbar {
    padding: 16px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    z-index: 10;
  }
  .topbar h3 { font-size: 16px; font-weight: 600; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .toggle-annotations {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-light);
    cursor: pointer;
    user-select: none;
  }
  .toggle-annotations input { display: none; }
  .toggle-track {
    width: 36px; height: 20px;
    background: #cbd5e1;
    border-radius: 10px;
    position: relative;
    transition: background var(--transition);
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    top: 2px; left: 2px;
    transition: transform var(--transition);
  }
  .toggle-annotations input:checked + .toggle-track {
    background: var(--primary);
  }
  .toggle-annotations input:checked + .toggle-track::after {
    transform: translateX(16px);
  }

  /* ============ 内容区 ============ */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-light);
  }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; }

  /* ============ 缩略图网格 ============ */
  .template-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .template-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: var(--shadow);
  }
  .template-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary-light);
  }
  .card-thumb {
    width: 100%;
    aspect-ratio: 16/10;
    background: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    overflow: hidden;
  }
  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-body {
    padding: 16px;
  }
  .card-body h4 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-body .meta {
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    gap: 12px;
  }
  .card-body .desc {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 8px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ============ 浮层预览 ============ */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .overlay.active { display: flex; }
  .overlay-inner {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    max-width: 90vw;
    max-height: 90vh;
    width: 800px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }
  .overlay-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .overlay-header h4 { font-size: 16px; font-weight: 600; }
  .overlay-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: var(--bg);
    color: var(--text-light);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }
  .overlay-close:hover { background: var(--error); color: #fff; }
  .overlay-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    gap: 20px;
  }
  .overlay-preview {
    flex: 1;
    position: relative;
    background: #0f172a;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    overflow: hidden;
  }
  .overlay-preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  /* 标注层 */
  .annotation-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }
  .annotation-layer.visible { display: block; }
  .annotation-box {
    position: absolute;
    border: 2px dashed var(--accent);
    background: rgba(245,158,11,0.08);
    transition: all var(--transition);
  }
  .annotation-label {
    position: absolute;
    top: -22px;
    left: -2px;
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
  }
  .overlay-info {
    width: 200px;
    min-width: 200px;
  }
  .overlay-info h5 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-light);
  }
  .editable-list {
    list-style: none;
  }
  .editable-list li {
    padding: 8px 10px;
    font-size: 13px;
    border-radius: 6px;
    margin-bottom: 4px;
    background: rgba(245,158,11,0.06);
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .editable-list li::before {
    content: '✏️';
    font-size: 12px;
  }
  .overlay-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: unset;
      max-height: 45vh;
      flex-shrink: 0;
    }
    .overlay-body { flex-direction: column; }
    .overlay-info { width: 100%; }
  }
</style>
</head>
<body>

<!-- 权限检查 -->
<script>
if (!sessionStorage.getItem('hotel_template_token')) {
  window.location.href = 'index.html';
}
</script>

<div class="app">
  <!-- 左侧导航 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">🏨</span>
      <h2>酒店模板展示</h2>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div style="padding:12px 20px; border-top:1px solid rgba(255,255,255,0.06);">
      <button class="nav-item" style="margin:0; width:100%; color:#64748b; font-size:13px;" onclick="sessionStorage.removeItem('hotel_template_token');window.location.href='index.html'">
        🚪 退出登录
      </button>
    </div>
  </aside>

  <!-- 右侧主区域 -->
  <main class="main-area">
    <div class="topbar">
      <h3 id="sectionTitle">全部模板</h3>
      <div class="topbar-actions">
        <label class="toggle-annotations" title="在浮层预览中显示/隐藏可编辑区域标注">
          <input type="checkbox" id="showAnnotations" checked>
          <span class="toggle-track"></span>
          <span>显示标注</span>
        </label>
      </div>
    </div>

    <div class="content" id="contentArea">
      <!-- 动态渲染 -->
    </div>
  </main>
</div>

<!-- 浮层预览 -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-header">
      <h4 id="overlayTitle">模板预览</h4>
      <button class="overlay-close" id="overlayClose">✕</button>
    </div>
    <div class="overlay-body">
      <div class="overlay-preview" id="overlayPreview">
        <img id="overlayImg" src="" alt="预览">
        <div class="annotation-layer" id="annotationLayer"></div>
      </div>
      <div class="overlay-info" id="overlayInfo"></div>
    </div>
    <div class="overlay-footer">
      <button class="btn btn-secondary" id="overlayCloseBtn">关闭</button>
      <button class="btn btn-secondary" id="downloadBtn">📥 下载素材</button>
      <button class="btn btn-primary" id="detailBtn">查看详情 →</button>
    </div>
  </div>
</div>

<script>
// ============ 数据加载 ============
let templatesData = [];
let currentCategory = 'all';
let currentTemplate = null;

async function loadTemplates() {
  try {
    const res = await fetch('data/templates.json?v=' + Date.now());
    templatesData = (await res.json()).templates || [];
  } catch (err) {
    console.error('加载模板数据失败:', err);
    templatesData = [];
  }
  render();
}

// ============ 渲染侧边栏 ============
function buildCategoryTree() {
  const map = new Map();
  templatesData.forEach(t => {
    const cat = t.category || '未分类';
    if (!map.has(cat)) map.set(cat, []);
    map.get(cat).push(t);
  });
  return map;
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const tree = buildCategoryTree();
  const totalCount = templatesData.length;

  let html = '';

  // 全部
  html += `<button class="nav-item ${currentCategory === 'all' ? 'active' : ''}" data-cat="all">
    <span class="dot">●</span> 全部模板 <span class="count">${totalCount}</span>
  </button>`;

  tree.forEach((items, cat) => {
    html += `<div class="nav-category">
      <div class="nav-cat-title">${cat}</div>`;
    items.forEach(t => {
      html += `<button class="nav-item ${currentCategory === t.id ? 'active' : ''}" data-cat="${t.id}">
        <span class="dot">●</span> ${t.name}
      </button>`;
    });
    html += `</div>`;
  });

  nav.innerHTML = html;

  // 点击事件
  nav.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCategory = btn.dataset.cat;
      renderSidebar();
      renderContent();
    });
  });
}

// ============ 渲染内容区 ============
function renderContent() {
  const area = document.getElementById('contentArea');
  const title = document.getElementById('sectionTitle');

  let items;
  if (currentCategory === 'all') {
    items = templatesData;
    title.textContent = `全部模板 (${items.length})`;
  } else {
    items = templatesData.filter(t => t.id === currentCategory || t.category === currentCategory);
    const catItem = templatesData.find(t => t.id === currentCategory);
    title.textContent = catItem ? catItem.name : currentCategory;
  }

  if (items.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <div class="icon">📭</div>
      <h3>暂无模板</h3>
      <p>模板数据为空，请联系管理员添加模板内容</p>
    </div>`;
    return;
  }

  area.innerHTML = `<div class="template-grid">
    ${items.map(t => `
      <div class="template-card fade-in" data-id="${t.id}">
        <div class="card-thumb">
          ${t.thumbnail
            ? `<img src="${t.thumbnail}" alt="${t.name}" loading="lazy" onerror="this.parentElement.innerHTML='🖼️'">`
            : '🖼️'}
        </div>
        <div class="card-body">
          <h4>${t.name}</h4>
          <div class="meta">
            <span>📁 ${t.category || '未分类'}</span>
            ${(() => {
              const total = t.sections ? t.sections.reduce((s, sec) => s + sec.screenshots.length, 0) : (t.screenshots?.length || 0);
              const sectionCount = t.sections?.length || 0;
              return sectionCount > 0
                ? `<span>📂 ${sectionCount} 子模块</span><span>📐 ${total} 张截图</span>`
                : `<span>📐 ${total} 张截图</span>`;
            })()}
          </div>
          ${t.description ? `<div class="desc">${t.description}</div>` : ''}
        </div>
      </div>
    `).join('')}
  </div>`;

  // 卡片点击 → 打开浮层
  area.querySelectorAll('.template-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      openOverlay(id);
    });
  });
}

// ============ 浮层预览 ============
function openOverlay(templateId) {
  currentTemplate = templatesData.find(t => t.id === templateId);
  if (!currentTemplate) return;

  const overlay = document.getElementById('overlay');
  const img = document.getElementById('overlayImg');
  const title = document.getElementById('overlayTitle');
  const info = document.getElementById('overlayInfo');
  const annotationLayer = document.getElementById('annotationLayer');

  title.textContent = currentTemplate.name;

  // 处理 sections 结构获取第一张截图和标注
  let firstScreenshot = currentTemplate.thumbnail || '';
  let allAreas = [];

  if (currentTemplate.sections && currentTemplate.sections.length > 0) {
    const firstSection = currentTemplate.sections[0];
    const firstScreen = firstSection.screenshots[0];
    if (firstScreen) {
      firstScreenshot = typeof firstScreen === 'string' ? firstScreen : firstScreen.file;
      allAreas = typeof firstScreen === 'string' ? [] : (firstScreen.editableAreas || []);
    }
  } else if (currentTemplate.screenshots && currentTemplate.screenshots.length > 0) {
    const firstScreen = currentTemplate.screenshots[0];
    firstScreenshot = typeof firstScreen === 'string' ? firstScreen : firstScreen.file;
    allAreas = typeof firstScreen === 'string' ? (currentTemplate.editableAreas || []) : (firstScreen.editableAreas || []);
  }

  img.src = firstScreenshot;

  // 标注层
  const showAnnotations = document.getElementById('showAnnotations').checked;
  annotationLayer.className = 'annotation-layer' + (showAnnotations ? ' visible' : '');
  renderAnnotations(annotationLayer, allAreas);

  // 信息面板
  const sections = currentTemplate.sections || [];
  const totalScreens = sections.length > 0
    ? sections.reduce((s, sec) => s + sec.screenshots.length, 0)
    : (currentTemplate.screenshots?.length || 0);

  info.innerHTML = `
    <h5>${sections.length > 0 ? sections[0].name + ' — ' : ''}可编辑区域 (${allAreas.length})</h5>
    ${allAreas.length > 0 ? `
      <ul class="editable-list">
        ${allAreas.map(a => `<li>${a.label}</li>`).join('')}
      </ul>
    ` : '<p style="font-size:13px;color:var(--text-light);">该模块暂无标注</p>'}
    ${sections.length > 0 ? `
      <h5 style="margin-top:16px;">包含子模块 (${sections.length})</h5>
      <ul class="editable-list">
        ${sections.map(s => `<li style="background:rgba(79,70,229,0.06)"><span>📄</span> ${s.name} (${s.screenshots.length}张)</li>`).join('')}
      </ul>
    ` : ''}
    <p style="font-size:11px;color:var(--text-light);margin-top:12px;">
      💡 点击「查看详情」可切换子模块和可编辑标注
    </p>
  `;

  overlay.classList.add('active');
}

function renderAnnotations(layer, areas) {
  if (!areas.length) {
    layer.innerHTML = '';
    return;
  }
  layer.innerHTML = areas.map(a => {
    const pw = Math.round(a.w * 1920 / 100);
    const ph = Math.round(a.h * 1080 / 100);
    return `
    <div class="annotation-box" style="left:${a.x}%;top:${a.y}%;width:${a.w}%;height:${a.h}%;">
      <span class="annotation-label">${a.label} ${pw}×${ph}px</span>
    </div>`;
  }).join('');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('active');
  currentTemplate = null;
}

// 标注开关实时更新
document.getElementById('showAnnotations').addEventListener('change', function() {
  const layer = document.getElementById('annotationLayer');
  if (this.checked) {
    layer.classList.add('visible');
  } else {
    layer.classList.remove('visible');
  }
});

// 浮层关闭按钮
document.getElementById('overlayClose').addEventListener('click', closeOverlay);
document.getElementById('overlayCloseBtn').addEventListener('click', closeOverlay);
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeOverlay();
});

// 查看详情
document.getElementById('detailBtn').addEventListener('click', () => {
  if (currentTemplate) {
    window.open(`detail.html?template=${currentTemplate.id}`, '_blank');
  }
});

// 下载素材
document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!currentTemplate) return;
  const materials = currentTemplate.downloadMaterials || [];
  if (materials.length === 0) {
    alert('该模板暂无素材可下载');
    return;
  }
  // 如果有多个素材，逐个下载
  materials.forEach(m => {
    const a = document.createElement('a');
    a.href = m.file;
    a.download = m.file.split('/').pop();
    a.click();
  });
});

// ============ 键盘关闭 ============
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeOverlay();
});

// ============ 渲染 ============
function render() {
  renderSidebar();
  renderContent();
}

// ============ 初始化 ============
loadTemplates();
</script>
</body>
</html>
